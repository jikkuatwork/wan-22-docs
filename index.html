<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAN 2.2 - AI Video Generation Examples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .video-container {
        aspect-ratio: 16/9;
      }
      .sidebar-transition {
        transition: transform 0.3s ease-in-out;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300"
  >
    <!-- Mobile Menu Button -->
    <button
      id="mobile-menu-btn"
      class="fixed top-4 left-4 z-50 lg:hidden bg-white dark:bg-gray-800 p-2 rounded-lg shadow-lg"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>

    <!-- Theme Toggle -->
    <button
      id="theme-toggle"
      class="fixed top-4 right-4 z-50 bg-white dark:bg-gray-800 p-2 rounded-lg shadow-lg"
    >
      <svg
        id="sun-icon"
        class="w-6 h-6 hidden dark:block"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
        ></path>
      </svg>
      <svg
        id="moon-icon"
        class="w-6 h-6 block dark:hidden"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        ></path>
      </svg>
    </button>

    <!-- Sidebar -->
    <div
      id="sidebar"
      class="fixed inset-y-0 left-0 z-40 w-80 bg-white dark:bg-gray-800 shadow-xl transform -translate-x-full lg:translate-x-0 sidebar-transition"
    >
      <div class="flex flex-col h-full">
        <!-- Header -->
        <div class="p-6 border-b border-gray-200 dark:border-gray-700">
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
            WAN 2.2
          </h1>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">
            AI Video Generation Examples
          </p>
        </div>

        <!-- Search -->
        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
          <div class="relative">
            <input
              id="search-input"
              type="text"
              placeholder="Search videos..."
              class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            <svg
              class="absolute left-3 top-2.5 w-5 h-5 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>
        </div>

        <!-- Categories -->
        <div class="flex-1 overflow-y-auto p-4">
          <div class="space-y-2">
            <button
              class="category-btn w-full text-left px-3 py-2 rounded-lg bg-blue-100 dark:bg-blue-900 text-blue-900 dark:text-blue-100 font-medium"
              data-category="all"
            >
              All Videos (<span id="total-count">0</span>)
            </button>
            <div id="category-list" class="space-y-1"></div>
          </div>
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
          <p class="text-xs text-gray-500 dark:text-gray-400">
            <span id="current-video-info">Video 1 of 94</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="lg:ml-80 min-h-screen">
      <!-- Content Area -->
      <div class="max-w-4xl mx-auto p-4 lg:p-8">
        <!-- Video Display -->
        <div id="video-container" class="fade-in">
          <!-- Video content will be dynamically loaded here -->
        </div>

      </div>
    </div>

    <!-- Overlay for mobile -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden hidden"
    ></div>

    <script>
      class WAN22App {
        constructor() {
          this.data = null
          this.currentVideoIndex = 0
          this.filteredVideos = []
          this.currentCategory = "all"
          this.searchTerm = ""

          this.init()
        }

        async init() {
          await this.loadData()
          this.setupEventListeners()
          this.setupTheme()
          this.renderCategories()
          this.filterVideos()
          this.renderCurrentVideo()
        }

        async loadData() {
          try {
            const response = await fetch("./data.json")
            this.data = await response.json()
          } catch (error) {
            console.error("Error loading data:", error)
          }
        }

        setupEventListeners() {
          // Mobile menu
          document
            .getElementById("mobile-menu-btn")
            .addEventListener("click", this.toggleSidebar.bind(this))
          document
            .getElementById("sidebar-overlay")
            .addEventListener("click", this.closeSidebar.bind(this))

          // Theme toggle
          document
            .getElementById("theme-toggle")
            .addEventListener("click", this.toggleTheme.bind(this))

          // Search
          document
            .getElementById("search-input")
            .addEventListener("input", this.handleSearch.bind(this))

          // Keyboard navigation
          document.addEventListener("keydown", this.handleKeyboard.bind(this))
        }

        setupTheme() {
          const savedTheme = localStorage.getItem("theme") || "light"
          if (savedTheme === "dark") {
            document.documentElement.classList.add("dark")
          }
        }

        toggleTheme() {
          const isDark = document.documentElement.classList.toggle("dark")
          localStorage.setItem("theme", isDark ? "dark" : "light")
        }

        toggleSidebar() {
          const sidebar = document.getElementById("sidebar")
          const overlay = document.getElementById("sidebar-overlay")

          if (sidebar.classList.contains("-translate-x-full")) {
            sidebar.classList.remove("-translate-x-full")
            overlay.classList.remove("hidden")
          } else {
            sidebar.classList.add("-translate-x-full")
            overlay.classList.add("hidden")
          }
        }

        closeSidebar() {
          document.getElementById("sidebar").classList.add("-translate-x-full")
          document.getElementById("sidebar-overlay").classList.add("hidden")
        }

        renderCategories() {
          const categoryList = document.getElementById("category-list")
          const categories = this.data.meta.categories

          categoryList.innerHTML = categories
            .map(cat => {
              const categoryData = this.data.categories[cat]
              const count = this.getVideosForCategory(cat).length

              return `
                        <button class="category-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-gray-700 dark:text-gray-300" data-category="${cat}">
                            ${categoryData.name} (${count})
                        </button>
                    `
            })
            .join("")

          // Add event listeners to category buttons
          document.querySelectorAll(".category-btn").forEach(btn => {
            btn.addEventListener("click", e => {
              this.selectCategory(e.target.dataset.category)
            })
          })

          // Update total count
          document.getElementById("total-count").textContent =
            this.data.meta.total_videos
        }

        getVideosForCategory(category) {
          if (category === "all") return this.data.videos || []
          return (this.data.videos || []).filter(
            video => video.category === category
          )
        }

        selectCategory(category) {
          this.currentCategory = category
          this.currentVideoIndex = 0

          // Update active category button
          document.querySelectorAll(".category-btn").forEach(btn => {
            if (btn.dataset.category === category) {
              btn.classList.add(
                "bg-blue-100",
                "dark:bg-blue-900",
                "text-blue-900",
                "dark:text-blue-100",
                "font-medium"
              )
              btn.classList.remove("text-gray-700", "dark:text-gray-300")
            } else {
              btn.classList.remove(
                "bg-blue-100",
                "dark:bg-blue-900",
                "text-blue-900",
                "dark:text-blue-100",
                "font-medium"
              )
              btn.classList.add("text-gray-700", "dark:text-gray-300")
            }
          })

          this.filterVideos()
          this.renderCurrentVideo()
          this.closeSidebar()
        }

        handleSearch(e) {
          this.searchTerm = e.target.value.toLowerCase()
          this.currentVideoIndex = 0
          this.filterVideos()
          this.renderCurrentVideo()
        }

        filterVideos() {
          let videos = this.getVideosForCategory(this.currentCategory)

          if (this.searchTerm) {
            videos = videos.filter(
              video =>
                video.title.toLowerCase().includes(this.searchTerm) ||
                video.description.toLowerCase().includes(this.searchTerm) ||
                video.category.toLowerCase().includes(this.searchTerm)
            )
          }

          this.filteredVideos = videos
        }

        cleanVideoDescription(description, title) {
          if (!description) return description;
          
          // Simple approach: Remove any bold text pattern at the beginning
          // Matches: **anything**, **anything**., **anything**,, etc.
          let cleaned = description.replace(/^\*\*[^*]+\*\*[*,，.\s]*/g, '');
          
          // Clean up any remaining leading punctuation and whitespace
          cleaned = cleaned.replace(/^[,，.\s]+/, '').trim();
          
          return cleaned;
        }

        renderCurrentVideo() {
          const container = document.getElementById("video-container")
          const video = this.filteredVideos[this.currentVideoIndex]

          if (!video) {
            // Show placeholder with same structure when no video found
            container.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                        <!-- Video Placeholder -->
                        <div class="video-container bg-gray-200 dark:bg-gray-700 relative flex items-center justify-center">
                            <div class="text-center">
                                <svg class="w-16 h-16 text-gray-400 dark:text-gray-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                </svg>
                                <p class="text-gray-500 dark:text-gray-400 text-lg">No videos found</p>
                                <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">Try adjusting your search or category filter</p>
                            </div>
                        </div>
                        
                        <!-- Content Placeholder -->
                        <div class="p-6">
                            <!-- Header with Navigation -->
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center space-x-3">
                                    <button id="copy-prompt" class="p-2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 rounded-lg transition-colors cursor-not-allowed" disabled>
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                        </svg>
                                    </button>
                                    <h2 class="text-2xl font-bold text-gray-400 dark:text-gray-500">
                                        No Title Available
                                    </h2>
                                </div>
                                <div class="flex space-x-2">
                                    <button id="prev-btn" class="flex items-center space-x-2 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                        </svg>
                                        <span>Previous</span>
                                    </button>
                                    <button id="next-btn" class="flex items-center space-x-2 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                        <span>Next</span>
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Prompt Placeholder -->
                            <div>
                                <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                                    <p class="text-gray-400 dark:text-gray-500 text-sm leading-relaxed italic">
                                        No prompt available. Please select a different category or adjust your search terms.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            this.updateNavigation()
            return
          }

          const categoryData = this.data.categories[video.category]

          container.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                        <!-- Video -->
                        <div class="video-container bg-black relative">
                            <video 
                                id="main-video"
                                class="w-full h-full object-cover" 
                                controls 
                                preload="metadata"
                                poster=""
                            >
                                <source src="${video.url}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                        
                        <!-- Content -->
                        <div class="p-6">
                            <!-- Header with Navigation -->
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center space-x-3">
                                    <button id="copy-prompt" class="p-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 rounded-lg transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                        </svg>
                                    </button>
                                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
                                        ${video.title}
                                    </h2>
                                </div>
                                <div class="flex space-x-2">
                                    <button id="prev-btn" class="flex items-center space-x-2 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                                        </svg>
                                        <span>Previous</span>
                                    </button>
                                    <button id="next-btn" class="flex items-center space-x-2 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                        <span>Next</span>
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Prompt -->
                            <div>
                                <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                                    <p class="text-gray-700 dark:text-gray-300 text-sm leading-relaxed" id="prompt-text">
                                        ${this.cleanVideoDescription(video.description, video.title)}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `

          // Add copy functionality
          document
            .getElementById("copy-prompt")
            .addEventListener("click", () => {
              navigator.clipboard.writeText(this.cleanVideoDescription(video.description, video.title)).then(() => {
                const btn = document.getElementById("copy-prompt")
                const originalIcon = btn.innerHTML
                btn.innerHTML = `
                            <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        `
                setTimeout(() => {
                  btn.innerHTML = originalIcon
                }, 1500)
              })
            })

          // Add navigation functionality to new buttons
          document.getElementById("prev-btn").addEventListener("click", this.previousVideo.bind(this))
          document.getElementById("next-btn").addEventListener("click", this.nextVideo.bind(this))

          this.updateNavigation()
          this.updateVideoInfo()
        }

        updateNavigation() {
          const prevBtn = document.getElementById("prev-btn")
          const nextBtn = document.getElementById("next-btn")

          prevBtn.disabled = this.currentVideoIndex === 0
          nextBtn.disabled =
            this.currentVideoIndex >= this.filteredVideos.length - 1
        }

        updateVideoInfo() {
          const info = document.getElementById("current-video-info")
          if (this.filteredVideos.length > 0) {
            info.textContent = `Video ${this.currentVideoIndex + 1} of ${this.filteredVideos.length}`
          } else {
            info.textContent = "No videos"
          }
        }

        previousVideo() {
          if (this.currentVideoIndex > 0) {
            this.currentVideoIndex--
            this.renderCurrentVideo()
          }
        }

        nextVideo() {
          if (this.currentVideoIndex < this.filteredVideos.length - 1) {
            this.currentVideoIndex++
            this.renderCurrentVideo()
          }
        }

        handleKeyboard(e) {
          if (e.target.tagName === "INPUT") return

          switch (e.key) {
            case "ArrowLeft":
              e.preventDefault()
              this.previousVideo()
              break
            case "ArrowRight":
              e.preventDefault()
              this.nextVideo()
              break
            case "Escape":
              this.closeSidebar()
              break
          }
        }
      }

      // Initialize app when DOM is loaded
      document.addEventListener("DOMContentLoaded", () => {
        new WAN22App()
      })
    </script>
  </body>
</html>
